# 컨테이너 입구. 호스트 nginx가 127.0.0.1:8083 으로 넘긴 요청을 나눕니다.
# Docker DNS를 다시 보도록 변수를 씁니다. 앱만 재시작되면 IP가 바뀌어도 어드민/TV가 뒤바뀌지 않습니다.
server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  set $nuri_api nuri-api;
  set $nuri_admin nuri-admin;
  set $nuri_tv nuri-tv;

  location = /display {
    return 308 /display/;
  }

  location /api/events {
    proxy_pass http://$nuri_api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  location /api {
    proxy_pass http://$nuri_api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /display/ {
    proxy_pass http://$nuri_tv:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://$nuri_admin:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
