# 호스트의 joyang(3000/5173/4000), erd-studio(8082/3001), sushi(3991)와 겹치지 않습니다.
# 밖으로 여는 포트는 127.0.0.1:8083 하나뿐입니다.
name: nuri-dashboard

services:
  api:
    container_name: nuri-api
    image: ${API_IMAGE:-ghcr.io/mulumpyo/nuri-dashboard/api:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      COOKIE_SECURE: "true"
      DATABASE_URL: postgres://nuri:${POSTGRES_PASSWORD}@nuri-postgres:5432/nuri
      REDIS_URL: redis://nuri-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nuri]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 512m

  admin:
    container_name: nuri-admin
    image: ${ADMIN_IMAGE:-ghcr.io/mulumpyo/nuri-dashboard/admin:latest}
    restart: unless-stopped
    networks: [nuri]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    container_name: nuri-tv
    image: ${DASHBOARD_IMAGE:-ghcr.io/mulumpyo/nuri-dashboard/dashboard:latest}
    restart: unless-stopped
    networks: [nuri]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/display/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    container_name: nuri-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nuri}
      TZ: Asia/Seoul
    volumes:
      - nuri_pgdata:/var/lib/postgresql/data
    networks: [nuri]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nuri} -d ${POSTGRES_DB:-nuri}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: nuri-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nuri_redis:/data
    networks: [nuri]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  nginx:
    container_name: nuri-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NURI_HTTP_PORT:-8083}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
      dashboard:
        condition: service_started
    networks: [nuri]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    container_name: nuri-backup
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      PGHOST: nuri-postgres
      PGUSER: ${POSTGRES_USER:-nuri}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-nuri}
    volumes:
      - nuri_pg_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [nuri]
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      echo "postgres daily backup started"
      while true; do
        day=$$(date +%F)
        file="/backups/nuri-$$day.dump"
        if [ ! -f "$$file" ]; then
          if pg_dump -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "wrote $$file"
          else
            rm -f "$$file.tmp"
            echo "dump failed"
          fi
        fi
        find /backups -name "nuri-*.dump" -mtime +14 -delete
        sleep 3600
      done

volumes:
  nuri_pgdata:
    name: nuri-dashboard-pgdata
  nuri_redis:
    name: nuri-dashboard-redis
  nuri_pg_backups:
    name: nuri-dashboard-backups

networks:
  nuri:
    name: nuri-dashboard
    driver: bridge
