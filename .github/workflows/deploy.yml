# deploy 브랜치에 푸시하거나 직접 실행하면
# 코드 검사 → 이미지 빌드 → 서버 배포 순서로 돌아가요.
name: 배포

on:
  push:
    branches: [deploy]
  # Actions 탭에서 직접 눌러도 배포할 수 있어요.
  workflow_dispatch:

# 같은 브랜치 배포가 겹치면, 앞 작업이 끝날 때까지 기다려요.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /home/ubuntu/nuri-dashboard
  SITE_URL: https://nuri.mulumpyo.com

jobs:
  check:
    name: 코드 검사
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuri
          POSTGRES_PASSWORD: nuri
          POSTGRES_DB: nuri
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nuri -d nuri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nuri:nuri@localhost:5432/nuri
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: nuri-ci-jwt-secret-not-for-production
      PUBLIC_ORIGIN: http://localhost:5173
      TOTP_ISSUER: 누리디에스엠
      COOKIE_SECURE: "false"
      TZ: Asia/Seoul
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v5

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Node.js 22 설치
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 패키지 설치 (lockfile 일치 확인)
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 마이그레이션
        run: pnpm --filter @nuri/api db:migrate

      - name: e2e 테스트
        run: pnpm --filter @nuri/api test:e2e

      - name: 빌드
        run: pnpm build

  build:
    name: 이미지 빌드 (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - file: apps/api/Dockerfile
            name: api
          - file: apps/admin/Dockerfile
            name: admin
          - file: apps/dashboard/Dockerfile
            name: dashboard
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v5

      - name: ARM 빌드를 위한 QEMU 설정
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 이미지 저장소(GHCR) 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ARM 이미지 빌드 후 GHCR에 올리기
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: prod
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: 서버에 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 내려받기
        uses: actions/checkout@v5

      - name: 배포 폴더 만들기
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: mkdir -p /home/ubuntu/nuri-dashboard/deploy

      - name: 실행 설정 서버로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: compose.prod.yaml,deploy/nginx.conf
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true

      # GitHub Secrets로 .env를 만들고, 새 이미지로 컨테이너를 다시 띄워요.
      - name: 환경 변수 작성 후 컨테이너 재시작
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SITE_URL: ${{ env.SITE_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_PREFIX,IMAGE_TAG,DEPLOY_DIR,SITE_URL,GHCR_USER,GHCR_TOKEN,JWT_SECRET,POSTGRES_PASSWORD,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_SECURE,SMTP_FROM,BOOTSTRAP_ADMIN_EMAIL,BOOTSTRAP_ADMIN_PASSWORD,DATA_GO_KR_SERVICE_KEY,RESEND_API_KEY
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            umask 077
            add_env() {
              key=$1
              val=${2-}
              if [ "${#val}" -ge 2 ]; then
                first=${val%"${val#?}"}
                last=${val#"${val%?}"}
                if [ "$first" = \" ] && [ "$last" = \" ]; then
                  val=${val#\"}
                  val=${val%\"}
                elif [ "$first" = "'" ] && [ "$last" = "'" ]; then
                  val=${val#\'}
                  val=${val%\'}
                fi
              fi
              val=$(printf '%s' "$val" | sed -e 's/\$/$$/g' -e "s/'/'\"'\"'/g")
              printf "%s='%s'\n" "$key" "$val"
            }
            {
              add_env NODE_ENV production
              add_env TZ Asia/Seoul
              add_env PUBLIC_ORIGIN "$SITE_URL"
              add_env COOKIE_SECURE true
              add_env JWT_SECRET "$JWT_SECRET"
              add_env RESEND_API_KEY "$RESEND_API_KEY"
              add_env POSTGRES_USER nuri
              add_env POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
              add_env POSTGRES_DB nuri
              add_env DATABASE_URL "postgres://nuri:${POSTGRES_PASSWORD}@nuri-postgres:5432/nuri"
              add_env REDIS_URL redis://nuri-redis:6379
              add_env NURI_HTTP_PORT 8083
              add_env API_IMAGE "$IMAGE_PREFIX/api:$IMAGE_TAG"
              add_env ADMIN_IMAGE "$IMAGE_PREFIX/admin:$IMAGE_TAG"
              add_env DASHBOARD_IMAGE "$IMAGE_PREFIX/dashboard:$IMAGE_TAG"
              add_env SMTP_HOST "$SMTP_HOST"
              add_env SMTP_PORT "$SMTP_PORT"
              add_env SMTP_USER "$SMTP_USER"
              add_env SMTP_PASS "$SMTP_PASS"
              add_env SMTP_SECURE "$SMTP_SECURE"
              add_env SMTP_FROM "$SMTP_FROM"
              add_env BOOTSTRAP_ADMIN_EMAIL "$BOOTSTRAP_ADMIN_EMAIL"
              add_env BOOTSTRAP_ADMIN_PASSWORD "$BOOTSTRAP_ADMIN_PASSWORD"
              add_env DATA_GO_KR_SERVICE_KEY "$DATA_GO_KR_SERVICE_KEY"
              add_env TOTP_ISSUER 누리디에스엠
              add_env PORT 3000
            } > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p nuri-dashboard -f compose.prod.yaml pull
            docker compose -p nuri-dashboard -f compose.prod.yaml up -d --remove-orphans
            docker compose -p nuri-dashboard -f compose.prod.yaml up -d --force-recreate --no-deps nginx
            docker compose -p nuri-dashboard -f compose.prod.yaml ps
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:8083/api/health/ready && docker image prune -f && exit 0
              sleep 3
            done
            docker compose -p nuri-dashboard -f compose.prod.yaml logs --tail=80
            exit 1
